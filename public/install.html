<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Installazione Automatica</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Installazione Automatica Wispbyte</h1>
  <p>Inserisci l’ID server Wispbyte per procedere.</p>

  <input id="serverId" type="text" placeholder="ID Server Wispbyte">
  <button onclick="install()">Installa</button>

  <p id="result"></p>
</div>

<script>
async function install() {
  const id = document.getElementById("serverId").value;

  const res = await fetch("/api/install", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ serverId: id })
  });

  const data = await res.json();
  document.getElementById("result").innerText = data.ok ? "Installazione avviata!" : "Errore: " + data.error;
}
</script>

</body>
</html>
