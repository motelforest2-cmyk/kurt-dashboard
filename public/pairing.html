<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Pairing Code WhatsApp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Inserisci il codice di pairing</h1>
  <p>Numero collegato: <span id="phone"></span></p>

  <input id="pairing" type="text" placeholder="Codice pairing">
  <button onclick="sendPairing()">Conferma</button>

  <p id="result"></p>
</div>

<script>
async function loadPhone() {
  const res = await fetch("/api/get-number");
  const data = await res.json();
  document.getElementById("phone").innerText = data.phone;
}

async function sendPairing() {
  const code = document.getElementById("pairing").value;

  const res = await fetch("/api/pairing", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code })
  });

  const data = await res.json();
  document.getElementById("result").innerText = data.ok ? "Pairing inviato!" : "Errore: " + data.error;
}

loadPhone();
</script>

</body>
</html>
