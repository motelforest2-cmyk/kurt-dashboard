<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Scansione QR WhatsApp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Scansiona il QR</h1>
  <p>Numero collegato: <span id="phone"></span></p>

  <div id="qr-box">
    <img id="qr-image" src="/api/qr" alt="QR Code WhatsApp">
  </div>

  <button onclick="refreshQR()">Aggiorna QR</button>
</div>

<script>
async function loadPhone() {
  const res = await fetch("/api/get-number");
  const data = await res.json();
  document.getElementById("phone").innerText = data.phone;
}

function refreshQR() {
  document.getElementById("qr-image").src = "/api/qr?ts=" + Date.now();
}

loadPhone();
</script>

</body>
</html>
